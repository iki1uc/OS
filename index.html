<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MXU · OS</title>
<style>
body{background:#000;color:#0ff;font-family:monospace;padding:20px;}
.box{border:1px solid #0ff;padding:20px;margin-bottom:20px;padding:20px;}
h2{margin-top:0;}
pre{white-space:pre-wrap;}
</style>
</head>

<body>

<h2>MXU · OS Runtime</h2>

<div class="box">
  <button onclick="run()">RUN MXU</button>
  <pre id="out">Bereit…</pre>
</div>

<script type="module">
import { MXU } from "./mxu.js";
import { AXINXA } from "./AXINXA.js";
import { SLI } from "../sync/SLI.js";

function run(){

  // MXU laden
  const sys = MXU.init();

  // AXINXA anhängen
  AXINXA.attach(sys);

  // SLI anhängen
  SLI.attach(sys);

  // Runtime-Daten erzeugen
  const P = Math.floor(Math.random()*12)+1;
  const Z = [0,1][Math.floor(Math.random()*2)];
  const RAW = sys.sli_raw(P,Z);

  sys.sli_addScore(Z ? 5 : -3);
  sys.sli_slideTo(P * 8);

  const out = {
    mxu: sys,
    raw,
    check: sys.sli_check(),
    position: P,
    zustand: Z
  };

  document.getElementById("out").innerText =
    JSON.stringify(out, null, 2);
}

</script>

</body>
</html>
