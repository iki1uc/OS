<!DOCTYPE html>
<html lang="de">
<head>

    <meta charset="UTF-8">
    <title>MXU · OS Runtime</title>

    <style>
        body{background:#000;color:#0ff;font-family:monospace;padding:20px;}
        .box{border:1px solid #0ff;padding:20px;margin-bottom:20px;}
        h2{margin-top:0;}
        pre{white-space:pre-wrap;}
        button{background:#111;color:#0ff;border:1px solid #0ff;padding:10px 20px;margin:5px;}
    </style>

</head>

<body>

<h2>MXU · OS Runtime</h2>
<div class="box">
    <div>OS · SYNC · AXINXA · SLI · RAW · MXU_CH</div>
</div>

<div class="box">
    <h3>Schalter</h3>

    <button onclick="os_switch()">OS aktivieren</button>
    <button onclick="sync_switch()">SYNC aktivieren</button>
    <button onclick="axinxa_switch()">AXINXA aktivieren</button>
    <button onclick="sli_switch()">SLI aktivieren</button>
    <button onclick="mxu_ch_switch()">MXU_CH aktivieren</button>
    <button onclick="raw_switch()">RAW‑Mode</button>
    <button onclick="geo_triangle_switch()">GEO‑Dreieck</button>
    <button onclick="geo_circle_switch()">GEO‑Circle</button>
    <button onclick="pq243_switch()">243 messen</button>
</div>

<div class="box">
    <button onclick="run()">RUN OS</button>
    <pre id="out">System bereit…</pre>
</div>

<div class="box">
    <h3>Runtime Log</h3>
    <pre id="log">JSON‑Ausgabe</pre>
</div>

<script type="module">

// --- LOG FUNKTION ---
function log(msg){
    document.getElementById("out").innerText = msg;
}

// --- SCHALTER FUNKTIONEN ---
window.os_switch = () => log("OS aktiviert → OS läuft.");
window.sync_switch = () => log("SYNC aktiviert → OS fusioniert → SYNC aktiv.");
window.axinxa_switch = () => log("AXINXA aktiviert → AX‑Boost aktiv.");
window.sli_switch = () => log("SLI aktiviert → Sync‑Link aktiv.");
window.mxu_ch_switch = () => log("MXU_CH aktiviert → Kanal aktiv.");
window.raw_switch = () => log("RAW‑Mode aktiv → RAW.me geladen.");
window.geo_triangle_switch = () => log("GEO‑Dreieck aktiviert.");
window.geo_circle_switch = () => log("GEO‑Circle aktiviert.");
window.pq243_switch = () => log("243 Messung gestartet → PQ‑Vector aktiv.");

// --- RUN OS ---
window.run = () => {
    log("MXU Runtime gestartet → OS → SYNC → AXINXA → SLI → RAW → MXU_CH");
};

</script>

</body>
</html>
